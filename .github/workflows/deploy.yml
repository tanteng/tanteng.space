name: Deploy tanteng.space → COS + EdgeOne purge

# 仅手动触发（按 9/6 + 9/7 立），无 push 自动部署
on:
  workflow_dispatch:

# 防止并发部署（同一个站点同一时间只允许一次）
concurrency:
  group: deploy-tanteng-space
  cancel-in-progress: false

# 仅读权限（GITHUB_TOKEN 只需 checkout）
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Secrets（GitHub repo → Settings → Secrets and variables → Actions）
      TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
      TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
      # 资源标识符（非 secret，硬编码）
      COS_BUCKET: www-1303209934
      COS_REGION: ap-guangzhou
      EO_ZONE_ID: zone-3g912l176apo
      EO_TARGET_HOST: tanteng.space
      # 待同步的静态文件清单（单一真相源：新增/删除文件只需改这里）
      STATIC_FILES: |
        index.html
        avatar.jpeg
        blog-cover.jpg
        og-image.png
        e.html
        favicon.ico
        favicon.png
        robots.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 安装 tccli + coscli v1.0.9
        run: |
          set -euo pipefail
          # tccli（腾讯云 CLI，含 EdgeOne / COS 全部 API）
          pip install tccli
          # coscli（COS 专用高速 CLI，官方 GitHub release v1.0.9）
          wget -q https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64 -O /usr/local/bin/coscli
          chmod +x /usr/local/bin/coscli
          coscli --version

      - name: 校验源文件齐全
        run: |
          missing=0
          while IFS= read -r f; do
            # 跳过空行与注释行
            [ -z "$f" ] && continue
            case "$f" in '#'*) continue ;; esac
            if [ ! -f "$f" ]; then
              echo "::error file=$f::源文件缺失"
              missing=1
            else
              echo "✓ $f ($(wc -c < "$f") bytes)"
            fi
          done <<< "$STATIC_FILES"
          [ "$missing" -eq 0 ] || (echo "FAIL: 源文件不全"; exit 1)

      - name: coscli 同步静态文件到 COS
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in '#'*) continue ;; esac
            coscli cp "$f" "cos://${COS_BUCKET}/${f}"
          done <<< "$STATIC_FILES"
          echo "✅ 全部 $(echo "$STATIC_FILES" | grep -cvE '^\s*(#|$)') 个静态文件同步完毕"

      - name: tccli 调 EdgeOne purge_host
        run: |
          tccli teo CreatePurgeTask \
            --Type purge_host \
            --Targets "[\"${EO_TARGET_HOST}\"]" \
            --ZoneId ${EO_ZONE_ID} \
            --region ap-guangzhou

      - name: 验证部署生效
        run: |
          sleep 3
          status=$(curl -s -o /dev/null -w "%{http_code}" https://tanteng.space/)
          etag=$(curl -sI https://tanteng.space/ | grep -i '^etag:' | awk '{print $2}' | tr -d '\r')
          echo "HTTP $status / ETag $etag"
          [ "$status" = "200" ] || (echo "FAIL: HTTP $status"; exit 1)